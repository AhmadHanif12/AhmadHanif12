name: Refresh profile activity

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check counting rules
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Refresh from GitHub's public calendar
        run: python3 -B scripts/update_activity.py
      - name: Publish updated cards
        run: |
          git add assets/activity.svg assets/calendar.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh contribution calendar'
          git push
